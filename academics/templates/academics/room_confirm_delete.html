{% extends "base.html" %}

{% block title %}Delete Room{% endblock %}

{% block content %}

<div class="max-w-lg mx-auto">

    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-8 text-center">

        <div class="w-16 h-16 rounded-full bg-red-100 flex items-center justify-center mx-auto mb-5">
            <i class="fa fa-trash text-red-600 text-2xl"></i>
        </div>

        <h1 class="text-xl font-bold text-slate-800">
            Delete Room?
        </h1>

        <p class="text-slate-500 mt-3">
            Are you sure you want to delete
            <strong class="text-slate-700">{{ room.name }}</strong>?
        </p>

        <form method="post" class="mt-8 flex justify-center gap-3">

            {% csrf_token %}

            <a
                href="{% url 'room_list' %}"
                class="px-6 py-3 bg-slate-100 text-slate-700 rounded-lg hover:bg-slate-200"
            >
                Cancel
            </a>

            <button
                type="submit"
                class="px-6 py-3 bg-red-600 text-white rounded-lg hover:bg-red-700"
            >
                Delete Room
            </button>

        </form>

    </div>

</div>

{% endblock %}
