{% extends "base.html" %}

{% block title %}Delete Notice{% endblock %}

{% block content %}

<div class="max-w-xl mx-auto">

    <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-6">

        <div class="w-14 h-14 rounded-full bg-red-50 flex items-center justify-center mb-5">
            <i class="fa fa-trash text-xl text-red-600"></i>
        </div>

        <h1 class="text-xl font-bold text-slate-800">
            Delete Notice?
        </h1>

        <p class="text-slate-600 mt-2">
            Are you sure you want to delete this notice?
        </p>

        <div class="bg-slate-50 border border-slate-200 rounded-lg p-4 mt-5">
            <p class="font-semibold text-slate-800">
                {{ notice.title }}
            </p>

            <p class="text-sm text-slate-500 mt-1">
                {{ notice.summary }}
            </p>
        </div>

        <form method="POST" class="flex flex-col sm:flex-row gap-3 mt-6">

            {% csrf_token %}

            <button type="submit"
                    class="inline-flex items-center justify-center gap-2 px-5 py-2.5 bg-red-600 text-white rounded-lg hover:bg-red-700 transition">
                <i class="fa fa-trash"></i>
                Yes, Delete
            </button>

            <a href="{% url 'notices:notice_detail' notice.id %}"
               class="inline-flex items-center justify-center gap-2 px-5 py-2.5 bg-slate-100 text-slate-700 rounded-lg hover:bg-slate-200 transition">
                <i class="fa fa-times"></i>
                Cancel
            </a>

        </form>

    </div>

</div>

{% endblock %}
