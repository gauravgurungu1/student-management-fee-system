{% extends "base.html" %}

{% block page_title %}
    Password Changed
{% endblock %}

{% block content %}

<div class="max-w-lg mx-auto">

    <div class="bg-white rounded-xl border border-slate-200
                shadow-sm p-8 text-center">

        <div
            class="w-14 h-14 mx-auto
                   rounded-full
                   bg-green-100
                   text-green-600
                   flex items-center
                   justify-center
                   text-xl">

            <i class="fa fa-check"></i>

        </div>


        <h1 class="text-xl font-semibold text-slate-800 mt-5">
            Password Changed Successfully
        </h1>


        <p class="text-sm text-slate-500 mt-2">
            Your password has been updated successfully.
        </p>


        <a
            href="{% url 'dashboard' %}"
            class="inline-flex items-center
                   mt-6
                   px-5 py-2.5
                   rounded-lg
                   bg-blue-600
                   text-white
                   hover:bg-blue-700
                   transition">

            <i class="fa fa-home mr-2"></i>

            Back to Dashboard

        </a>

    </div>

</div>

{% endblock %}
