{% extends "base.html" %}

{% block title %}Teacher Login{% endblock %}

{% block content %}

<div class="min-h-[70vh] flex items-center justify-center">

    <div class="w-full max-w-md">

        <div class="text-center mb-8">

            <h1 class="text-2xl font-bold text-slate-800">
                Teacher Login
            </h1>

            <p class="text-slate-500 mt-2">
                Enter your password to continue.
            </p>

        </div>

        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">

            <form method="post" action="{% url 'teacher_password_login' %}">

                {% csrf_token %}

                <input
                    type="hidden"
                    name="phone"
                    value="{{ phone }}"
                >

                <div class="mb-6">

                    <label class="block text-sm font-medium text-slate-700 mb-2">
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        required
                        autofocus
                        class="w-full px-4 py-3 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                        placeholder="Enter your password"
                    >

                </div>

                <button
                    type="submit"
                    class="w-full py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition font-medium"
                >
                    Login
                </button>

            </form>

            <div class="text-center mt-4">

                <a
                    href="{% url 'teacher_login' %}"
                    class="text-sm text-blue-600 hover:text-blue-700"
                >
                    Use a different phone number
                </a>

            </div>

        </div>

    </div>

</div>

{% endblock %}
