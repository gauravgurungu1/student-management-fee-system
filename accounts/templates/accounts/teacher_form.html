{% extends "base.html" %}

{% block title %}Add Teacher{% endblock %}

{% block content %}

<div class="max-w-2xl mx-auto">

    <div class="mb-6">
        <h1 class="text-2xl font-bold text-slate-800">
            Add Teacher
        </h1>

        <p class="text-slate-500 mt-1">
            Register a teacher using their basic information.
        </p>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">

        <form method="post">
            {% csrf_token %}

            <div class="mb-5">
                <label class="block text-sm font-medium text-slate-700 mb-2">
                    Teacher Name
                </label>

                <input
                    type="text"
                    name="name"
                    value="{{ name|default:'' }}"
                    required
                    class="w-full px-4 py-3 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                    placeholder="Enter teacher name"
                >
            </div>

            <div class="mb-6">
                <label class="block text-sm font-medium text-slate-700 mb-2">
                    Phone Number
                </label>

                <input
                    type="tel"
                    name="phone"
                    value="{{ phone|default:'' }}"
                    required
                    class="w-full px-4 py-3 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                    placeholder="Enter phone number"
                >
            </div>

            <div class="flex justify-end gap-3">

                <a
                    href="{% url 'teacher_list' %}"
                    class="px-5 py-2.5 border border-slate-200 rounded-lg text-slate-600 hover:bg-slate-50 transition"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="px-5 py-2.5 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition"
                >
                    Add Teacher
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
