{% extends "base.html" %}

{% block title %}Create Password{% endblock %}

{% block content %}

<div class="min-h-[70vh] flex items-center justify-center">

    <div class="w-full max-w-md">

        <div class="text-center mb-8">

            <h1 class="text-2xl font-bold text-slate-800">
                Create Your Password
            </h1>

            <p class="text-slate-500 mt-2">
                Welcome, {{ teacher.name }}.
                Create a password for your teacher account.
            </p>

        </div>

        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">

            <form method="post">

                {% csrf_token %}

                <div class="mb-5">

                    <label class="block text-sm font-medium text-slate-700 mb-2">
                        New Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        required
                        minlength="8"
                        class="w-full px-4 py-3 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                        placeholder="Minimum 8 characters"
                    >

                </div>

                <div class="mb-6">

                    <label class="block text-sm font-medium text-slate-700 mb-2">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        name="confirm_password"
                        required
                        minlength="8"
                        class="w-full px-4 py-3 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                        placeholder="Re-enter your password"
                    >

                </div>

                <button
                    type="submit"
                    class="w-full py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition font-medium"
                >
                    Create Password
                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
