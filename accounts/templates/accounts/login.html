<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administrator Login | Student Management System</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    >
</head>


<body class="min-h-screen bg-slate-100 flex items-center justify-center px-4">

    <div class="w-full max-w-md">

        <!-- Login Card -->
        <div class="bg-white rounded-2xl shadow-lg p-8">

            <!-- Header -->
            <div class="text-center mb-8">

                <!-- Logo -->
                <div
                    class="w-14 h-14 bg-blue-900 text-white rounded-xl
                           flex items-center justify-center
                           mx-auto mb-4 shadow-sm"
                >

                    <span class="text-2xl font-bold">
                        S
                    </span>

                </div>


                <!-- Title -->
                <h1 class="text-2xl font-bold text-slate-800">
                    Student Management System
                </h1>


                <!-- Subtitle -->
                <p class="text-slate-500 mt-2">
                    Administrator Portal
                </p>

            </div>


            <!-- Django Messages -->
            {% if messages %}

                <div class="space-y-3 mb-6">

                    {% for message in messages %}

                        <div
                            class="flex items-start gap-3
                                   bg-red-50 border border-red-200
                                   text-red-700
                                   px-4 py-3 rounded-lg"
                        >

                            <i
                                class="fa fa-exclamation-circle mt-0.5"
                                aria-hidden="true"
                            ></i>

                            <p class="text-sm">
                                {{ message }}
                            </p>

                        </div>

                    {% endfor %}

                </div>

            {% endif %}


            <!-- Login Form -->
            <form method="POST">

                {% csrf_token %}


                <!-- Username -->
                <div class="mb-5">

                    <label
                        for="username"
                        class="block text-sm font-medium
                               text-slate-700 mb-2"
                    >
                        Username
                    </label>


                    <div class="relative">

                        <span
                            class="absolute left-4 top-1/2
                                   -translate-y-1/2
                                   text-slate-400"
                        >
                            <i class="fa fa-user"></i>
                        </span>


                        <input
                            type="text"
                            name="username"
                            id="username"
                            required
                            autofocus
                            autocomplete="username"
                            class="w-full pl-11 pr-4 py-3
                                   border border-slate-300
                                   rounded-lg
                                   outline-none
                                   transition
                                   focus:border-blue-500
                                   focus:ring-2
                                   focus:ring-blue-200"
                            placeholder="Enter your username"
                        >

                    </div>

                </div>


                <!-- Password -->
                <div class="mb-6">

                    <label
                        for="password"
                        class="block text-sm font-medium
                               text-slate-700 mb-2"
                    >
                        Password
                    </label>


                    <div class="relative">

                        <!-- Lock Icon -->
                        <span
                            class="absolute left-4 top-1/2
                                   -translate-y-1/2
                                   text-slate-400"
                        >
                            <i class="fa fa-lock"></i>
                        </span>


                        <!-- Password Input -->
                        <input
                            type="password"
                            name="password"
                            id="password"
                            required
                            autocomplete="current-password"
                            class="w-full pl-11 pr-12 py-3
                                   border border-slate-300
                                   rounded-lg
                                   outline-none
                                   transition
                                   focus:border-blue-500
                                   focus:ring-2
                                   focus:ring-blue-200"
                            placeholder="Enter your password"
                        >


                        <!-- Show / Hide Password -->
                        <button
                            type="button"
                            onclick="togglePassword()"
                            class="absolute right-4 top-1/2
                                   -translate-y-1/2
                                   text-slate-400
                                   hover:text-slate-600
                                   transition"
                            aria-label="Show password"
                        >

                            <i
                                id="passwordIcon"
                                class="fa fa-eye"
                            ></i>

                        </button>

                    </div>

                </div>


                <!-- Login Button -->
                <button
                    type="submit"
                    class="w-full bg-blue-900
                           text-white
                           py-3
                           rounded-lg
                           font-semibold
                           hover:bg-blue-800
                           active:bg-blue-950
                           transition
                           focus:outline-none
                           focus:ring-2
                           focus:ring-blue-300
                           focus:ring-offset-2"
                >

                    <i class="fa fa-sign-in mr-2"></i>

                    Login

                </button>

            </form>


            <!-- Teacher Login -->
            <div class="mt-6 pt-6 border-t border-slate-200 text-center">

                <p class="text-sm text-slate-500">

                    Are you a teacher?

                    <a
                        href="{% url 'teacher_login' %}"
                        class="font-medium text-blue-700
                               hover:text-blue-900
                               transition"
                    >
                        Teacher Login
                    </a>

                </p>

            </div>

        </div>


        <!-- Footer -->
        <p class="text-center text-xs text-slate-400 mt-5">
            Student Management and Fee Payment System
        </p>

    </div>


    <!-- JavaScript -->
    <script>

        function togglePassword() {

            const password =
                document.getElementById("password");

            const icon =
                document.getElementById("passwordIcon");


            if (password.type === "password") {

                password.type = "text";

                icon.classList.remove("fa-eye");

                icon.classList.add("fa-eye-slash");

            } else {

                password.type = "password";

                icon.classList.remove("fa-eye-slash");

                icon.classList.add("fa-eye");

            }

        }

    </script>

</body>

</html>
