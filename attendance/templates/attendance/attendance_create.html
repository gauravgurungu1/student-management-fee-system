{% extends "teacher_base.html" %}

{% block title %}Mark Attendance{% endblock %}

{% block page_title %}Mark Attendance{% endblock %}

{% block content %}

<div class="max-w-2xl mx-auto">

    <div class="mb-6">

        <h1 class="text-2xl font-bold text-slate-800">
            Mark Attendance
        </h1>

        <p class="text-slate-500 mt-1">
            Select one of your assigned classes.
        </p>

    </div>


    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">

        <form method="POST">

            {% csrf_token %}


            <div class="mb-6">

                <label
                    for="assignment"
                    class="block text-sm font-medium text-slate-700 mb-2"
                >
                    Subject &amp; Batch
                </label>

                <select
                    name="assignment"
                    id="assignment"
                    required
                    class="w-full px-4 py-3 border border-slate-200
                           rounded-lg outline-none
                           focus:ring-2 focus:ring-blue-500
                           focus:border-blue-500"
                >

                    <option value="">
                        Select subject and batch
                    </option>

                    {% for assignment in assignments %}

                    <option
                        value="{{ assignment.id }}"
                        {% if assignment.id|stringformat:"s" == selected_assignment_id|stringformat:"s" %}
                            selected
                        {% endif %}
                    >
                        {{ assignment.subject.code }}
                        -
                        {{ assignment.subject.name }}
                        |
                        {{ assignment.subject.course.name }}
                        |
                        Batch {{ assignment.batch }}
                    </option>

                    {% endfor %}

                </select>

            </div>


            <div class="mb-6">

                <label
                    for="date"
                    class="block text-sm font-medium text-slate-700 mb-2"
                >
                    Attendance Date
                </label>

               <input
                    type="date"
                    name="date"
                    id="date"
                    value="{{ today|date:'Y-m-d' }}"
                    max="{{ today|date:'Y-m-d' }}"
                    required
                    class="w-full px-4 py-3 border border-slate-200
                        rounded-lg outline-none
                        focus:ring-2 focus:ring-blue-500
                        focus:border-blue-500"
                >

            </div>


            <div class="flex justify-end gap-3">

                <a
                    href="{% url 'attendance_list' %}"
                    class="px-5 py-3 rounded-lg
                           border border-slate-200
                           text-slate-600 hover:bg-slate-50"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="px-5 py-3 rounded-lg
                           bg-blue-600 hover:bg-blue-700
                           text-white"
                >
                    Continue
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
